name: Monitor Typefully API & Competitors

on:
  schedule:
    - cron: "0 8 * * 1,4"  # Mon & Thu 8am UTC (1:30pm IST)
  workflow_dispatch: {}

concurrency:
  group: typefully-upstream-monitor
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .monitor-cache
          key: monitor-cache-${{ github.run_id }}
          restore-keys: monitor-cache-

      - name: Fetch and validate public upstream sources
        run: python3 scripts/monitor.py

      - name: Report changes or degraded monitoring
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          from pathlib import Path

          cache = Path(".monitor-cache")
          result = json.loads((cache / "result.json").read_text())
          if result["report_needed"]:
              # A stable title deduplicates the same unresolved change/failure.
              issues = json.loads(subprocess.check_output([
                  "gh", "issue", "list", "--state", "open", "--search",
                  result["fingerprint"] + " in:title",
                  "--json", "title", "--limit", "100",
              ], text=True))
              if not any(issue["title"] == result["title"] for issue in issues):
                  subprocess.run([
                      "gh", "issue", "create", "--title", result["title"],
                      "--body-file", str(cache / "report.md"),
                  ], check=True)
          subprocess.run(["python3", "scripts/monitor.py", "--commit"], check=True)
          PYTHON

      - name: Save cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .monitor-cache
          key: monitor-cache-${{ github.run_id }}

      - name: Fail visibly on degraded monitoring
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          result = json.loads(Path(".monitor-cache/result.json").read_text())
          if result["failed"]:
              raise SystemExit("Upstream fetch failed; see monitoring issue and result.json")
          PYTHON
