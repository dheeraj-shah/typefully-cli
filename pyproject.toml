[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typefully-cli"
version = "0.1.0"
description = "CLI for the Typefully API -- manage drafts, threads, and publishing from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Dheeraj Shah" }]
keywords = ["typefully", "twitter", "social-media", "cli", "x"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-httpx>=0.30", "ruff"]

[project.scripts]
typefully = "typefully_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/dheeraj-shah/typefully-cli"
Repository = "https://github.com/dheeraj-shah/typefully-cli"
Issues = "https://github.com/dheeraj-shah/typefully-cli/issues"
Changelog = "https://github.com/dheeraj-shah/typefully-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/typefully_cli"]

[tool.ruff]
target-version = "py39"
line-length = 100
